name: Build policy catalog

on:
  push:
    branches: [main, test]
    paths:
      - 'IntuneConfig/**/*.json'
      - 'EntraConfig/**/*.json'
      - 'SharePointConfig/**/*.json'
      - 'ExchangeOnline/**/*.json'
      - 'DefenderCloudApps/**/*.json'
      - 'DefenderOffice365/**/*.json'
      - 'metadata/**'
      - 'bundles.json'
      - 'tools/build_catalog.py'
      - 'tools/build_setting_names.py'
  # The export workflows push with GITHUB_TOKEN, which never triggers 'push'
  # workflows - so rebuild whenever one of them finishes instead.
  workflow_run:
    workflows: ['Intune Backup', 'CDW Entra Baseline Backup', 'CDW Defender Baseline Backup']
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: generated-files-${{ github.event_name == 'workflow_run' && 'main' || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Structural problems should stop the build. Missing or stale enrichment
      # should not, or every new policy would fail CI before it can be enriched.
      - name: Build catalog
        run: |
          python tools/build_catalog.py \
            --root . \
            --policy-dirs IntuneConfig EntraConfig SharePointConfig ExchangeOnline DefenderCloudApps DefenderOffice365 \
            --out catalog.json \
            --fail-on duplicateId unreadable danglingBundleMember conflictingSettings danglingGoalBundle danglingScenarioGoal

      # Portal display names for the settings the library uses, from the weekly
      # Settings Catalog snapshot. Used by the LLD; skipped if the snapshot is missing.
      - name: Build setting names
        run: |
          if git fetch --quiet --depth 1 origin settings-catalog; then
            git show FETCH_HEAD:settings.ndjson > "$RUNNER_TEMP/settings.ndjson"
            python tools/build_setting_names.py --catalog "$RUNNER_TEMP/settings.ndjson" --policies IntuneConfig --out site/setting-names.json
          else
            echo "settings-catalog branch not found; keeping site/setting-names.json"
          fi

      - name: Summary
        run: python tools/build_catalog.py --root . --policy-dirs IntuneConfig EntraConfig SharePointConfig ExchangeOnline DefenderCloudApps DefenderOffice365 --report >> $GITHUB_STEP_SUMMARY

      # Stage 2 slots in here: read catalog.json, find issues of type
      # missingEnrichment or staleEnrichment, call GPT-4o for each, write the
      # sidecar, then re-run the build so catalog.json picks them up.

      - name: Commit catalog
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # metadata/ only exists once sidecars have been authored, so stage it
          # conditionally — an absent folder must not fail the run.
          git add catalog.json site/setting-names.json
          if [ -d metadata ]; then git add metadata; fi
          if git diff --staged --quiet; then
            echo "No catalog changes"
          else
            git commit -m "chore: rebuild policy catalog [skip ci]"
            BRANCH="${{ github.event_name == 'workflow_run' && 'main' || github.ref_name }}"
            for i in 1 2 3; do git pull --rebase --quiet origin "$BRANCH" && git push origin "HEAD:$BRANCH" && break; sleep 5; done
          fi

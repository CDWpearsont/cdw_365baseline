name: Build policy manifest

# Regenerates manifest.base.json and manifest.json whenever a policy JSON or
# the human overlay changes, and after each export run. On main it commits the
# result directly; on pull requests it
# only validates, so a PR that forgets to regenerate fails rather than silently
# shipping a stale manifest.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'site/**'
      - 'docs/**'
      - '.github/**'
      - 'manifest.base.json'
      - 'manifest.json'
  # The export workflows push with GITHUB_TOKEN, which never triggers 'push'
  # workflows - so regenerate whenever one of them finishes instead.
  workflow_run:
    workflows: ['Intune Backup', 'CDW Entra Baseline Backup', 'CDW Defender Baseline Backup']
    types: [completed]
    branches: [main]
  pull_request:
    paths-ignore:
      - 'site/**'
      - 'docs/**'
      - 'manifest.base.json'
      - 'manifest.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('manifest-{0}', github.ref) || 'main-generated-files' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  manifest:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || '' }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Pull requests: validate only. Fails if the committed manifest is stale
      # or if two policies resolve to the same stable ID.
      - name: Validate manifest is current
        if: github.event_name == 'pull_request'
        run: python3 scripts/generate-manifest.py --repo . --check

      - name: Generate manifest
        if: github.event_name != 'pull_request'
        run: python3 scripts/generate-manifest.py --repo .

      - name: Commit manifest
        if: github.event_name != 'pull_request'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.base.json manifest.json
          if git diff --staged --quiet; then
            echo "Manifest already current"
          else
            git commit -m "chore: regenerate policy manifest [skip ci]"
            for i in 1 2 3; do git pull --rebase --quiet origin main && git push origin HEAD:main && break; sleep 5; done
          fi

      - name: Summary
        if: always()
        run: |
          if [ -f manifest.json ]; then
            python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json, collections
          m = json.load(open('manifest.json'))
          e = m['entries']
          print('## Policy manifest\n')
          print(f"- **{m['count']}** objects")
          print(f"- **{m.get('enrichedCount', 0)}** enriched, "
                f"**{m['count'] - m.get('enrichedCount', 0)}** awaiting overlay\n")
          wl = collections.Counter(x['workload'] for x in e)
          print('| Workload | Objects |')
          print('|---|---|')
          for k, v in sorted(wl.items()):
              print(f'| {k} | {v} |')
          flags = collections.Counter(f for x in e for f in x.get('flags', []))
          if flags:
              print('\n### Flags\n')
              for k, v in flags.most_common():
                  print(f'- `{k}`: {v}')
          EOF
          fi

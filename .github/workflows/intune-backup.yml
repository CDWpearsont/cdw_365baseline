name: CDW 365 Baseline Backup

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify PowerShell
        shell: pwsh
        run: |
          $PSVersionTable.PSVersion

      - name: Install Microsoft.Graph modules
        shell: pwsh
        run: |
          Install-Module Microsoft.Graph.Authentication, Microsoft.Graph.DeviceManagement, Microsoft.Graph.DeviceManagement.Enrollment, Microsoft.Graph.Devices.CorporateManagement, Microsoft.Graph.Beta.DeviceManagement, Microsoft.Graph.Beta.Devices.CorporateManagement, Microsoft.Graph.Identity.SignIns -Scope CurrentUser -Force -AllowClobber -ErrorAction Stop

      - name: Export Intune Configurations to Repo (CDW Baseline only)
        env:
          CLIENT_ID:     ${{ secrets.CLIENT_ID }}
          TENANT_ID:     ${{ secrets.TENANT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
        shell: pwsh
        run: |
          try {
            # Authentication
            $body = @{
                client_id     = $env:CLIENT_ID
                scope         = "https://graph.microsoft.com/.default"
                client_secret = $env:CLIENT_SECRET
                grant_type    = "client_credentials"
            }
            $tokenResponse = Invoke-RestMethod -Method Post -Uri "https://login.microsoftonline.com/$env:TENANT_ID/oauth2/v2.0/token" -Body $body -ContentType "application/x-www-form-urlencoded" -ErrorAction Stop
            $secureToken = ConvertTo-SecureString $tokenResponse.access_token -AsPlainText -Force
            Connect-MgGraph -AccessToken $secureToken -NoWelcome -ErrorAction Stop
            Write-Output "Connected."

            $backupRoot = "./IntuneConfig"
            if (-not (Test-Path $backupRoot)) { New-Item -Path $backupRoot -ItemType Directory -Force | Out-Null }

            # Remove tenant-specific read-only fields (Compliance + Device Config)
            function Remove-TenantSpecificFields {
              param([object]$Policy)
              # Strip read-only fields (both camelCase and PascalCase variants from SDK)
              $fieldsToRemove = @("id","Id","createdDateTime","CreatedDateTime",
                "lastModifiedDateTime","LastModifiedDateTime","version","Version",
                "roleScopeTagIds","RoleScopeTagIds","assignments","Assignments",
                "@odata.context","@odata.type","@odata.etag",
                "supportsScopeTags","SupportsScopeTags","isAssigned","IsAssigned",
                "deviceStatuses","DeviceStatuses","userStatuses","UserStatuses",
                "deviceStatusOverview","DeviceStatusOverview",
                "userStatusOverview","UserStatusOverview",
                "deviceSettingStateSummaries","DeviceSettingStateSummaries",
                "scheduledActionsForRule","ScheduledActionsForRule",
                "deviceCompliancePolicyScript","DeviceCompliancePolicyScript")
              foreach ($field in $fieldsToRemove) {
                if ($Policy.PSObject.Properties.Name -contains $field) {
                  $Policy.PSObject.Properties.Remove($field)
                }
              }
              return $Policy
            }

            # Flatten PowerShell SDK object (PascalCase + AdditionalProperties)
            # into the flat camelCase format expected by Graph REST API.
            # Used for DeviceConfigurations and CompliancePolicies.
            function Convert-ToRestFormat {
              param([object]$Policy)
              $result = @{}
              # Start with AdditionalProperties (contains @odata.type and type-specific props)
              if ($Policy.AdditionalProperties) {
                foreach ($key in $Policy.AdditionalProperties.Keys) {
                  $result[$key] = $Policy.AdditionalProperties[$key]
                }
              }
              # Overlay top-level SDK properties, converting PascalCase to camelCase
              $skip = @("AdditionalProperties","Id","CreatedDateTime","LastModifiedDateTime",
                "Version","Assignments","DeviceStatuses","UserStatuses",
                "DeviceStatusOverview","UserStatusOverview",
                "DeviceSettingStateSummaries","ScheduledActionsForRule",
                "RoleScopeTagIds","SupportsScopeTags","IsAssigned",
                "DeviceCompliancePolicyScript")
              foreach ($prop in $Policy.PSObject.Properties) {
                if ($skip -contains $prop.Name) { continue }
                if ($null -eq $prop.Value) { continue }
                $camelName = $prop.Name.Substring(0,1).ToLower() + $prop.Name.Substring(1)
                $result[$camelName] = $prop.Value
              }
              return [PSCustomObject]$result
            }

            # Remove obsolete JSON files from a folder
            function Clean-FolderForCDW {
              param([string]$FolderPath, [string[]]$CurrentPolicyNames)
              if (-not (Test-Path $FolderPath)) { return }
              Get-ChildItem -Path $FolderPath -File -Filter "*.json" | ForEach-Object {
                if ($CurrentPolicyNames -notcontains $_.BaseName) {
                  Write-Output "Removing obsolete: $($_.Name)"
                  Remove-Item $_.FullName -Force
                }
              }
            }

            # Convert Graph SDK setting to create-ready format.
            # Covers all six value types — order matters (most specific first).
            function Inject-ODataType {
                # Injects @odata.type into a value container object or array.
                # Handles three shapes:
                #   - Hashtable (single object)  -> inject directly
                #   - PSCustomObject             -> convert to hashtable first
                #   - Array                      -> inject into each element
                param($Value, [string]$Type)

                if ($Value -is [System.Array]) {
                    return @($Value | ForEach-Object { Inject-ODataType -Value $_ -Type $Type })
                }

                # Ensure we have a mutable hashtable
                if ($Value -isnot [hashtable]) {
                    $Value = $Value | ConvertTo-Json -Depth 20 | ConvertFrom-Json -AsHashtable
                }

                if (-not $Value.ContainsKey('@odata.type')) {
                    $Value['@odata.type'] = $Type
                }
                return $Value
            }

            function Convert-ToCreateSetting {
                param([object]$setting)
                $instance  = $setting.SettingInstance
                $odataType = $instance.AdditionalProperties.'@odata.type'
                $ap        = $instance.AdditionalProperties

                $createInstance = [ordered]@{
                    "@odata.type"       = $odataType
                    settingDefinitionId = $instance.SettingDefinitionId
                }

                # Export settingInstanceTemplateReference (required for ES template-based policies)
                if ($null -ne $instance.SettingInstanceTemplateReference -and
                    $null -ne $instance.SettingInstanceTemplateReference.SettingInstanceTemplateId) {
                    $createInstance.settingInstanceTemplateReference = @{
                        settingInstanceTemplateId = $instance.SettingInstanceTemplateReference.SettingInstanceTemplateId
                    }
                }

                if ($null -ne $ap.choiceSettingValue) {
                    $createInstance.choiceSettingValue = Inject-ODataType `
                        -Value $ap.choiceSettingValue `
                        -Type '#microsoft.graph.deviceManagementConfigurationChoiceSettingValue'
                }
                elseif ($null -ne $ap.simpleSettingValue) {
                    # simpleSettingValue carries @odata.type from the SDK — pass through
                    $createInstance.simpleSettingValue = $ap.simpleSettingValue
                }
                elseif ($null -ne $ap.simpleSettingCollectionValue) {
                    # simpleSettingCollectionValue elements need the concrete type (String/Integer),
                    # not the abstract SimpleSettingValue
                    $fixed = @($ap.simpleSettingCollectionValue | ForEach-Object {
                        $elem = $_
                        if ($elem -isnot [hashtable]) {
                            $elem = $elem | ConvertTo-Json -Depth 20 | ConvertFrom-Json -AsHashtable
                        }
                        if ($null -ne $elem.value -and $elem.value -is [int]) {
                            $elem['@odata.type'] = '#microsoft.graph.deviceManagementConfigurationIntegerSettingValue'
                        } else {
                            $elem['@odata.type'] = '#microsoft.graph.deviceManagementConfigurationStringSettingValue'
                        }
                        $elem
                    })
                    $createInstance.simpleSettingCollectionValue = $fixed
                }
                elseif ($null -ne $ap.choiceSettingCollectionValue) {
                    $createInstance.choiceSettingCollectionValue = Inject-ODataType `
                        -Value $ap.choiceSettingCollectionValue `
                        -Type '#microsoft.graph.deviceManagementConfigurationChoiceSettingValue'
                }
                elseif ($null -ne $ap.groupSettingCollectionValue) {
                    # groupSettingCollectionValue is always an array — inject type on each element
                    $createInstance.groupSettingCollectionValue = Inject-ODataType `
                        -Value $ap.groupSettingCollectionValue `
                        -Type '#microsoft.graph.deviceManagementConfigurationGroupSettingValue'
                }
                elseif ($null -ne $ap.groupSettingValue) {
                    $createInstance.groupSettingValue = Inject-ODataType `
                        -Value $ap.groupSettingValue `
                        -Type '#microsoft.graph.deviceManagementConfigurationGroupSettingValue'
                }
                else { Write-Warning "No value type matched for: $($instance.SettingDefinitionId)" }

                return @{ settingInstance = $createInstance }
            }

            # Compliance Policies
            try {
              $compPath = "$backupRoot/CompliancePolicies"
              New-Item -Path $compPath -ItemType Directory -Force | Out-Null
              $cdwComp = Get-MgDeviceManagementDeviceCompliancePolicy -All | Where-Object { $_.DisplayName -like "*CDW Baseline*" }
              foreach ($policy in $cdwComp) {
                $safeName = $policy.DisplayName -replace '[^a-zA-Z0-9-]', '_'
                $clean = Convert-ToRestFormat -Policy $policy
                $clean | ConvertTo-Json -Depth 20 | Out-File "$compPath/$safeName.json" -Encoding UTF8
              }
              Clean-FolderForCDW -FolderPath $compPath -CurrentPolicyNames ($cdwComp.DisplayName | ForEach-Object { $_ -replace '[^a-zA-Z0-9-]', '_' })
              Write-Output "Exported $($cdwComp.Count) compliance policies"
            } catch { Write-Error "Compliance export failed: $($_.Exception.Message)" }

            # Device Configurations
            try {
              $configPath = "$backupRoot/DeviceConfigurations"
              New-Item -Path $configPath -ItemType Directory -Force | Out-Null
              $cdwConfigs = Get-MgDeviceManagementDeviceConfiguration -All | Where-Object { $_.DisplayName -like "*CDW Baseline*" }
              foreach ($config in $cdwConfigs) {
                $safeName = $config.DisplayName -replace '[^a-zA-Z0-9-]', '_'
                $clean = Convert-ToRestFormat -Policy $config
                $clean | ConvertTo-Json -Depth 20 | Out-File "$configPath/$safeName.json" -Encoding UTF8
              }
              Clean-FolderForCDW -FolderPath $configPath -CurrentPolicyNames ($cdwConfigs.DisplayName | ForEach-Object { $_ -replace '[^a-zA-Z0-9-]', '_' })
              Write-Output "Exported $($cdwConfigs.Count) device configurations"
            } catch { Write-Error "Device Configurations export failed: $($_.Exception.Message)" }

            # Endpoint Security + Settings Catalog
            try {
              $esPath = "$backupRoot/EndpointSecurity"
              $scPath = "$backupRoot/SettingsCatalog"
              New-Item -Path $esPath -ItemType Directory -Force | Out-Null
              New-Item -Path $scPath -ItemType Directory -Force | Out-Null

              $cdwAll = Get-MgBetaDeviceManagementConfigurationPolicy -All -ErrorAction Stop |
                        Where-Object { $_.Name -like "*CDW Baseline*" }

              $esFamilies = @('endpointSecurityAntivirus','endpointSecurityDiskEncryption',
                'endpointSecurityFirewall','endpointSecurityEndpointDetectionAndResponse',
                'endpointSecurityAttackSurfaceReduction','endpointSecurityAccountProtection',
                'endpointSecurityApplicationControl')

              $cdwES = $cdwAll | Where-Object { $esFamilies -contains $_.TemplateReference.TemplateFamily }
              $cdwSC = $cdwAll | Where-Object { $esFamilies -notcontains $_.TemplateReference.TemplateFamily }

              foreach ($policy in $cdwES) {
                $safeName = $policy.Name -replace '[^a-zA-Z0-9-]', '_'
                $settings = Get-MgBetaDeviceManagementConfigurationPolicySetting -DeviceManagementConfigurationPolicyId $policy.Id -All
                $convertedSettings = @($settings | ForEach-Object { Convert-ToCreateSetting -setting $_ })
                [ordered]@{
                  name              = $policy.Name
                  description       = $policy.Description
                  platforms         = $policy.Platforms.ToString()
                  technologies      = $policy.Technologies.ToString()
                  templateReference = @{
                    templateId     = $policy.TemplateReference.TemplateId
                    templateFamily = $policy.TemplateReference.TemplateFamily.ToString()
                  }
                  settings          = $convertedSettings
                } | ConvertTo-Json -Depth 20 | Out-File "$esPath/$safeName.json" -Encoding UTF8
                Write-Output "Exported (ES): $($policy.Name)"
              }
              Clean-FolderForCDW -FolderPath $esPath -CurrentPolicyNames ($cdwES.Name | ForEach-Object { $_ -replace '[^a-zA-Z0-9-]', '_' })

              foreach ($policy in $cdwSC) {
                $safeName = $policy.Name -replace '[^a-zA-Z0-9-]', '_'
                $settings = Get-MgBetaDeviceManagementConfigurationPolicySetting -DeviceManagementConfigurationPolicyId $policy.Id -All
                $convertedSettings = @($settings | ForEach-Object { Convert-ToCreateSetting -setting $_ })
                [ordered]@{
                  name         = $policy.Name
                  description  = $policy.Description
                  platforms    = $policy.Platforms.ToString()
                  technologies = $policy.Technologies.ToString()
                  settings     = $convertedSettings
                } | ConvertTo-Json -Depth 20 | Out-File "$scPath/$safeName.json" -Encoding UTF8
                Write-Output "Exported (SC): $($policy.Name)"
              }
              Clean-FolderForCDW -FolderPath $scPath -CurrentPolicyNames ($cdwSC.Name | ForEach-Object { $_ -replace '[^a-zA-Z0-9-]', '_' })

              Write-Output "Exported $($cdwES.Count) ES and $($cdwSC.Count) SC policies"
            } catch { Write-Error "ES/SC export failed: $($_.Exception.Message)" }

            # Enrolment Restrictions
            try {
              $erPath = "$backupRoot/EnrolmentRestrictions"
              New-Item -Path $erPath -ItemType Directory -Force | Out-Null
              $cdwER = Get-MgDeviceManagementDeviceEnrollmentConfiguration -All |
                       Where-Object { $_.DisplayName -like "*CDW Baseline*" } |
                       Sort-Object Id -Unique
              foreach ($policy in $cdwER) {
                $safeName = $policy.DisplayName -replace '[^a-zA-Z0-9-]', '_'
                # Use REST directly — SDK flattens platform restriction subtypes poorly
                $detail = Invoke-MgGraphRequest -Method GET `
                  -Uri "https://graph.microsoft.com/beta/deviceManagement/deviceEnrollmentConfigurations/$($policy.Id)" `
                  -ErrorAction Stop
                $removeFields = @('id','createdDateTime','lastModifiedDateTime','version',
                  'roleScopeTagIds','assignments','priorityMetaData','@odata.context')
                foreach ($f in $removeFields) { $detail.Remove($f) }
                $detail | ConvertTo-Json -Depth 20 | Out-File "$erPath/$safeName.json" -Encoding UTF8
                Write-Output "Exported (ER): $($policy.DisplayName)"
              }
              Clean-FolderForCDW -FolderPath $erPath -CurrentPolicyNames ($cdwER.DisplayName | ForEach-Object { $_ -replace '[^a-zA-Z0-9-]', '_' })
              Write-Output "Exported $($cdwER.Count) enrolment restriction policies"
            } catch { Write-Warning "Enrolment Restrictions export failed: $($_.Exception.Message)" }

            # MAM App Protection Policies (Android + iOS)
            # Requires DeviceManagementApps.Read.All on the app registration.
            # The top-level policy object does not include the apps list — requires a separate child call.
            try {
              $mamPath = "$backupRoot/AppProtectionPolicies"
              New-Item -Path $mamPath -ItemType Directory -Force | Out-Null

              $mamEndpoints = @(
                @{ Uri = "https://graph.microsoft.com/beta/deviceAppManagement/androidManagedAppProtections"; Platform = "Android" },
                @{ Uri = "https://graph.microsoft.com/beta/deviceAppManagement/iosManagedAppProtections";     Platform = "iOS" }
              )

              $allMAMNames = @()
              $totalMAM    = 0
              foreach ($ep in $mamEndpoints) {
                $response    = Invoke-MgGraphRequest -Method GET -Uri $ep.Uri -ErrorAction Stop
                $mamPolicies = $response.value | Where-Object { $_.displayName -like "*CDW Baseline*" }

                foreach ($policy in $mamPolicies) {
                  $safeName     = $policy.displayName -replace '[^a-zA-Z0-9-]', '_'
                  $allMAMNames += $safeName

                  # Fetch apps list — separate child resource, not present on parent object
                  $appsUri      = "$($ep.Uri)/$($policy.id)/apps"
                  $appsResponse = Invoke-MgGraphRequest -Method GET -Uri $appsUri -ErrorAction SilentlyContinue
                  $appsList     = if ($appsResponse) { $appsResponse.value } else { @() }

                  # Strip read-only fields from policy
                  $removePolicy = @('id','createdDateTime','lastModifiedDateTime','version',
                    'roleScopeTagIds','deployedAppCount','isAssigned','@odata.context','@odata.type')
                  foreach ($f in $removePolicy) { $policy.Remove($f) }

                  # Strip read-only fields from each app entry
                  $cleanApps = @($appsList | ForEach-Object {
                    $app = $_
                    @('id','version') | ForEach-Object { $app.Remove($_) }
                    $app
                  })

                  $policy['apps'] = $cleanApps
                  $policy | ConvertTo-Json -Depth 20 | Out-File "$mamPath/$safeName.json" -Encoding UTF8
                  Write-Output "Exported (MAM/$($ep.Platform)): $($policy.displayName)"
                  $totalMAM++
                }
              }
              Clean-FolderForCDW -FolderPath $mamPath -CurrentPolicyNames $allMAMNames
              Write-Output "Exported $totalMAM MAM app protection policies"
            } catch { Write-Warning "MAM App Protection export failed: $($_.Exception.Message)" }


name: CDW Defender Baseline Backup

# Required App Registration permissions (Application, not Delegated):
#   On the "WindowsDefenderATP" API (not Microsoft Graph):
#   - Ti.ReadWrite.All                (read/write Indicators / IoCs)
#
# The app registration must have admin consent granted for these permissions.
#
# Token acquisition uses the LEGACY resource URI:
#   https://api.securitycenter.microsoft.com
# Even though the API endpoint is:
#   https://api.security.microsoft.com
# This is a known Microsoft quirk — mismatched audience causes 403.
#
# Secrets required: DEFENDER_CLIENT_ID, DEFENDER_TENANT_ID, DEFENDER_CLIENT_SECRET
# (Separate from Graph/Intune secrets — can be the same app reg if it has both
#  Graph and WindowsDefenderATP permissions, but separate secrets allow isolation)

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Export Defender for Endpoint Configurations
        env:
          CLIENT_ID:     ${{ secrets.DEFENDER_CLIENT_ID }}
          TENANT_ID:     ${{ secrets.DEFENDER_TENANT_ID }}
          CLIENT_SECRET: ${{ secrets.DEFENDER_CLIENT_SECRET }}
        shell: pwsh
        run: |
          try {
            # ─── Authentication ──────────────────────────────────────
            # Token must target the LEGACY resource URI for MDE APIs
            $tokenBody = @{
                client_id     = $env:CLIENT_ID
                scope         = "https://api.securitycenter.microsoft.com/.default"
                client_secret = $env:CLIENT_SECRET
                grant_type    = "client_credentials"
            }
            $tokenResponse = Invoke-RestMethod -Method Post `
              -Uri "https://login.microsoftonline.com/$($env:TENANT_ID)/oauth2/v2.0/token" `
              -Body $tokenBody `
              -ContentType "application/x-www-form-urlencoded" `
              -ErrorAction Stop

            $mdeToken = $tokenResponse.access_token
            $headers = @{
              Authorization  = "Bearer $mdeToken"
              'Content-Type' = 'application/json'
            }
            Write-Output "Authenticated to MDE API."

            $mdeBase = "https://api.security.microsoft.com"
            $backupRoot = "./DefenderConfig"
            if (-not (Test-Path $backupRoot)) { New-Item -Path $backupRoot -ItemType Directory -Force | Out-Null }

            # ─── Helper: Remove read-only / tenant-specific fields ───
            function Remove-MdeReadOnlyFields {
              param([hashtable]$Item)
              $fieldsToRemove = @(
                "id",
                "creationTimeDateTimeUtc",
                "lastUpdateTime",
                "lastUpdatedBy",
                "createdBy",
                "createdByDisplayName",
                "createdBySource",
                "sourceType",
                "source"
              )
              foreach ($field in $fieldsToRemove) {
                $Item.Remove($field) | Out-Null
              }
              return $Item
            }

            # ─── Helper: Remove obsolete JSON files from a folder ────
            function Clean-FolderForCDW {
              param([string]$FolderPath, [string[]]$CurrentFileNames)
              if (-not (Test-Path $FolderPath)) { return }
              Get-ChildItem -Path $FolderPath -File -Filter "*.json" | ForEach-Object {
                if ($CurrentFileNames -notcontains $_.Name) {
                  Write-Output "Removing obsolete: $($_.Name)"
                  Remove-Item $_.FullName -Force
                }
              }
            }

            # ═════════════════════════════════════════════════════════
            # INDICATORS (IoCs)
            # ═════════════════════════════════════════════════════════
            # Exports all active indicators. These are tenant-wide IoCs
            # covering file hashes, IPs, URLs, domains, and certificates.
            #
            # The import API on the deploy side uses:
            #   POST /api/indicators/import  (batch, up to 500 per call)
            # or individual:
            #   POST /api/indicators         (single indicator)
            #
            # We export one JSON file per indicator type for cleaner
            # organisation, plus a combined _all.json for convenience.
            # ═════════════════════════════════════════════════════════
            try {
              $indPath = "$backupRoot/Indicators"
              New-Item -Path $indPath -ItemType Directory -Force | Out-Null

              # Fetch all indicators (paginated via OData)
              $allIndicators = @()
              $url = "$mdeBase/api/indicators"
              do {
                $response = Invoke-RestMethod -Method Get -Uri $url -Headers $headers -ErrorAction Stop
                $allIndicators += $response.value
                $url = $response.'@odata.nextLink'
              } while ($url)

              Write-Output "Found $($allIndicators.Count) total indicators"

              # Filter to CDW-prefixed indicators (title field)
              # If no CDW prefix convention is used, export ALL indicators
              $cdwIndicators = $allIndicators | Where-Object { $_.title -like "CDW*" }
              if ($cdwIndicators.Count -eq 0) {
                Write-Output "No CDW-prefixed indicators found — exporting all indicators"
                $cdwIndicators = $allIndicators
              }

              # Group by indicatorType for organised export
              $indicatorTypes = @(
                "FileSha1", "FileSha256", "FileMd5",
                "IpAddress", "DomainName", "Url",
                "CertificateThumbprint"
              )

              $allClean = @()
              $currentFiles = @()

              foreach ($type in $indicatorTypes) {
                $typeIndicators = @($cdwIndicators | Where-Object { $_.indicatorType -eq $type })
                if ($typeIndicators.Count -eq 0) { continue }

                $cleanIndicators = @()
                foreach ($ind in $typeIndicators) {
                  # Round-trip to get clean hashtable
                  $clean = $ind | ConvertTo-Json -Depth 10 | ConvertFrom-Json -AsHashtable
                  $clean = Remove-MdeReadOnlyFields -Item $clean
                  $cleanIndicators += $clean
                  $allClean += $clean
                }

                $fileName = "Indicators_$type.json"
                $currentFiles += $fileName
                @{
                  _comment      = "CDW Baseline - MDE Indicators ($type)"
                  indicatorType = $type
                  count         = $cleanIndicators.Count
                  indicators    = $cleanIndicators
                } | ConvertTo-Json -Depth 20 | Out-File "$indPath/$fileName" -Encoding UTF8
                Write-Output "Exported $($cleanIndicators.Count) $type indicators"
              }

              # Combined file for bulk import convenience
              if ($allClean.Count -gt 0) {
                $fileName = "Indicators_All.json"
                $currentFiles += $fileName
                @{
                  _comment   = "CDW Baseline - All MDE Indicators (combined)"
                  count      = $allClean.Count
                  indicators = $allClean
                } | ConvertTo-Json -Depth 20 | Out-File "$indPath/$fileName" -Encoding UTF8
              }

              Clean-FolderForCDW -FolderPath $indPath -CurrentFileNames $currentFiles
              Write-Output "Exported $($allClean.Count) indicators total"
            } catch {
              $statusCode = $null
              if ($_.Exception.Response) { $statusCode = $_.Exception.Response.StatusCode.value__ }
              if ($statusCode -eq 403) {
                Write-Error "403 Forbidden — the app registration is missing 'Ti.ReadWrite.All' permission on the WindowsDefenderATP API (with admin consent)."
              } else {
                Write-Error "Indicators export failed ($statusCode): $($_.Exception.Message)"
              }
            }

            # ═════════════════════════════════════════════════════════
            # CUSTOM DETECTION RULES (Advanced Hunting)
            # ═════════════════════════════════════════════════════════
            # Custom detection rules combine a KQL query with response
            # actions. Export via:
            #   GET /api/customdetections
            # Deploy via:
            #   POST /api/customdetections
            #
            # Note: Queries reference table schemas that must exist in
            # the target tenant. Cross-tenant portability depends on
            # both tenants having the same MDE/M365D data tables.
            # ═════════════════════════════════════════════════════════
            try {
              $cdPath = "$backupRoot/CustomDetections"
              New-Item -Path $cdPath -ItemType Directory -Force | Out-Null

              $cdResponse = Invoke-RestMethod -Method Get -Uri "$mdeBase/api/customdetections" -Headers $headers -ErrorAction Stop
              $allRules = @($cdResponse.value)

              # Filter to CDW-prefixed rules
              $cdwRules = @($allRules | Where-Object { $_.displayName -like "CDW*" })
              if ($cdwRules.Count -eq 0) {
                Write-Output "No CDW-prefixed custom detection rules found — exporting all"
                $cdwRules = $allRules
              }

              Write-Output "Found $($cdwRules.Count) custom detection rules"

              $currentFiles = @()
              foreach ($rule in $cdwRules) {
                $safeName = ($rule.displayName -replace '[^a-zA-Z0-9-]', '_') + ".json"
                $currentFiles += $safeName

                $clean = $rule | ConvertTo-Json -Depth 20 | ConvertFrom-Json -AsHashtable
                # Remove read-only fields
                @("id", "createdDateTime", "lastModifiedDateTime", "createdBy",
                  "lastModifiedBy", "lastRunDetails") | ForEach-Object {
                  $clean.Remove($_) | Out-Null
                }

                $clean | ConvertTo-Json -Depth 20 | Out-File "$cdPath/$safeName" -Encoding UTF8
                Write-Output "Exported (CD): $($rule.displayName)"
              }

              Clean-FolderForCDW -FolderPath $cdPath -CurrentFileNames $currentFiles
              Write-Output "Exported $($cdwRules.Count) custom detection rules"
            } catch {
              $statusCode = $null
              if ($_.Exception.Response) { $statusCode = $_.Exception.Response.StatusCode.value__ }
              if ($statusCode -eq 403) {
                Write-Warning "Custom detection rules export skipped — may require 'AdvancedHunting.Read.All' permission."
              } else {
                Write-Warning "Custom detection rules export failed: $($_.Exception.Message)"
              }
            }

            # ═════════════════════════════════════════════════════════
            # GIT COMMIT & PUSH
            # ═════════════════════════════════════════════════════════
            git config --global user.name "CDW Baseline Bot"
            git config --global user.email "actions@github.com"
            git add "$backupRoot/"
            $commitMsg = "Automated CDW Defender Baseline export - $(Get-Date -Format 'yyyy-MM-dd HH:mm')"
            if (git diff --cached --quiet) {
              Write-Output "No changes to commit"
            } else {
              git commit -m "$commitMsg"
              git push origin HEAD
              Write-Output "Committed and pushed"
            }
          }
          catch {
            Write-Error "Fatal error: $($_.Exception.Message)"
            exit 1
          }
